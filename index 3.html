<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Global Spin & Win</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --black: #0a0a0a;
            --dark-grey: #1a1a1a;
            --blue: #00d2ff;
        }

        body {
            margin: 0; padding: 0;
            background: var(--black);
            font-family: 'Poppins', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            color: white; overflow-x: hidden;
        }

        /* Top Scrolling Bar */
        .scrolling-bar {
            width: 100%; height: 40px;
            background: #111; border-bottom: 1px solid var(--gold);
            display: flex; align-items: center; overflow: hidden;
        }

        .flag-track {
            display: flex; width: calc(200px * 12);
            animation: scroll 25s linear infinite;
        }

        .country {
            width: 200px; display: flex; align-items: center; justify-content: center;
            gap: 8px; font-size: 13px; font-weight: bold; color: var(--gold);
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Main App Container */
        .app-card {
            width: 360px; height: 750px;
            background: linear-gradient(180deg, #151515 0%, #000 100%);
            margin-top: 15px; border-radius: 45px;
            border: 2px solid #333; position: relative;
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.1);
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; box-sizing: border-box;
        }

        /* Wallet Section */
        .wallet-card {
            width: 90%; background: rgba(255, 255, 255, 0.05);
            border-radius: 20px; padding: 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }

        .balance-info hp { margin: 0; font-size: 12px; color: #aaa; }
        .balance-amount { margin: 0; font-size: 24px; font-weight: bold; color: var(--blue); }

        /* Action Buttons */
        .action-btns {
            display: flex; gap: 10px; width: 90%; margin-bottom: 25px;
        }

        .btn {
            flex: 1; padding: 12px; border-radius: 12px; border: none;
            font-weight: bold; cursor: pointer; transition: 0.3s;
            font-family: 'Poppins', sans-serif; font-size: 14px;
        }

        .btn-deposit { background: #27ae60; color: white; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3); }
        .btn-withdraw { background: #e74c3c; color: white; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3); }
        .btn:active { transform: scale(0.95); }

        /* Wheel Design */
        .wheel-box {
            position: relative; width: 280px; height: 280px;
        }

        .wheel-box::after {
            content: '▼'; position: absolute; top: -18px; left: 50%;
            transform: translateX(-50%); font-size: 28px; color: var(--gold); z-index: 10;
            text-shadow: 0 0 10px var(--gold);
        }

        .wheel {
            width: 100%; height: 100%; border-radius: 50%;
            border: 6px solid var(--gold); position: relative;
            overflow: hidden; transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
            background: #000;
        }

        .segment {
            position: absolute; width: 50%; height: 50%;
            transform-origin: 100% 100%; display: flex;
            align-items: center; justify-content: center;
        }

        .segment:nth-child(1) { background: #111; transform: rotate(0deg); }
        .segment:nth-child(2) { background: #181818; transform: rotate(90deg); }
        .segment:nth-child(3) { background: #111; transform: rotate(180deg); }
        .segment:nth-child(4) { background: #181818; transform: rotate(270deg); }

        .segment b {
            transform: rotate(45deg); color: var(--gold);
            font-family: 'Cinzel', serif; font-size: 13px;
            margin-bottom: -40px; margin-right: -40px;
        }

        .spin-btn {
            margin-top: 40px; width: 180px; height: 180px;
            background: radial-gradient(circle, #d4af37, #8a6d1d);
            border-radius: 50%; border: 8px solid #111;
            color: black; font-family: 'Cinzel', serif;
            font-size: 22px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            transition: 0.3s; z-index: 5;
            position: absolute; bottom: 80px;
        }

        .spin-btn:hover { box-shadow: 0 0 40px var(--gold); }

        #msg {
            margin-top: auto; margin-bottom: 30px;
            font-size: 18px; font-weight: 600; color: var(--gold);
            text-align: center; height: 30px;
        }
    </style>
</head>
<body>

    <div class="scrolling-bar">
        <div class="flag-track">
            <div class="country">🇦🇪 DUBAI</div><div class="country">🇺🇸 USA</div>
            <div class="country">🇨🇳 CHINA</div><div class="country">🇱🇰 SRI LANKA</div>
            <div class="country">🇬🇧 UK</div><div class="country">🇷🇺 RUSSIA</div>
            <div class="country">🇦🇪 DUBAI</div><div class="country">🇺🇸 USA</div>
            <div class="country">🇨🇳 CHINA</div><div class="country">🇱🇰 SRI LANKA</div>
            <div class="country">🇬🇧 UK</div><div class="country">🇷🇺 RUSSIA</div>
        </div>
    </div>

    <div class="app-card">
        <h2 style="font-family: 'Cinzel', serif; color: var(--gold); margin-top: 10px;">GRAND SPIN</h2>

        <div class="wallet-card">
            <div class="balance-info">
                <p style="margin:0; font-size:11px; color:#888;">TOTAL BALANCE</p>
                <p class="balance-amount" id="balance">$ 5,240.00</p>
            </div>
            <div style="font-size: 24px;">💰</div>
        </div>

        <div class="action-btns">
            <button class="btn btn-deposit" onclick="alert('Deposit Portal Opening...')">DEPOSIT</button>
            <button class="btn btn-withdraw" onclick="alert('Withdrawal Request Sent!')">WITHDRAW</button>
        </div>

        <div class="wheel-box">
            <div class="wheel" id="wheel">
                <div class="segment"><b>WATCH</b></div>
                <div class="segment"><b>MONEY</b></div>
                <div class="segment"><b>DRESS</b></div>
                <div class="segment"><b>PERFUME</b></div>
            </div>
        </div>

        <button class="spin-btn" onclick="spinNow()">SPIN</button>
        
        <div id="msg">WIN EXCLUSIVE PRIZES</div>
    </div>

    <script>
        let currentRotation = 0;
        let isSpinning = false;
        let balance = 5240;

        function spinNow() {
            if (isSpinning) return;
            if (balance < 100) {
                alert("Insufficient Balance to Spin!");
                return;
            }

            isSpinning = true;
            // Spin ekakata $100 kapanawa kiyamuko
            balance -= 100;
            updateBalance();

            const wheel = document.getElementById('wheel');
            const msg = document.getElementById('msg');
            msg.innerHTML = "LUCK IS SPINNING...";

            const rounds = 3600; // 10 full rounds
            const rand = Math.floor(Math.random() * 360);
            currentRotation += (rounds + rand);

            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const deg = currentRotation % 360;
                
                // Hariyatama Pointer eka yata thiyena segment eka calculation eka
                let winningIndex = Math.floor(((360 - deg + 45) % 360) / 90);
                
                let prize = "";
                let bonus = 0;

                if(winningIndex === 0) { prize = "ROLEX WATCH ⌚"; bonus = 0; }
                else if(winningIndex === 1) { prize = "PREMIUM PERFUME 🧴"; bonus = 0; }
                else if(winningIndex === 2) { prize = "DESIGNER DRESS 👗"; bonus = 0; }
                else if(winningIndex === 3) { prize = "JACKPOT $500 💵"; bonus = 500; }

                balance += bonus;
                updateBalance();
                msg.innerHTML = "YOU WON: " + prize;
            }, 5000);
        }

        function updateBalance() {
            document.getElementById('balance').innerHTML = "$ " + balance.toLocaleString() + ".00";
        }
    </script>

</body>
</html>
