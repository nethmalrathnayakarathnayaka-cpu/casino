<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Spin Wheel</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background-color: #2c3e50;
            font-family: sans-serif;
            flex-direction: column;
        }

        .mainbox {
            position: relative;
            width: 400px;
            height: 400px;
        }

        /* Wheel eke pointer eka */
        .mainbox::after {
            content: '▼';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            color: #e74c3c;
            font-size: 30px;
            z-index: 10;
        }

        .box {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 50%;
            border: 8px solid #fff;
            overflow: hidden;
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
            background: #ecf0f1;
        }

        .item {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* Kotas 8kata bedima */
        .item:nth-child(1) { background: #1abc9c; transform: rotate(0deg) skewY(-45deg); }
        .item:nth-child(2) { background: #3498db; transform: rotate(45deg) skewY(-45deg); }
        .item:nth-child(3) { background: #9b59b6; transform: rotate(90deg) skewY(-45deg); }
        .item:nth-child(4) { background: #f1c40f; transform: rotate(135deg) skewY(-45deg); }
        .item:nth-child(5) { background: #e67e22; transform: rotate(180deg) skewY(-45deg); }
        .item:nth-child(6) { background: #e74c3c; transform: rotate(225deg) skewY(-45deg); }
        .item:nth-child(7) { background: #2ecc71; transform: rotate(270deg) skewY(-45deg); }
        .item:nth-child(8) { background: #34495e; transform: rotate(315deg) skewY(-45deg); }

        .item b {
            transform: skewY(45deg) rotate(22deg);
            position: absolute;
            right: 20px;
            bottom: 40px;
            text-align: center;
            width: 80px;
        }

        .spin-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px #c0392b;
            transition: 0.2s;
        }

        .spin-btn:active {
            box-shadow: 0 2px #c0392b;
            transform: translateY(3px);
        }

        #result {
            margin-top: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <div class="mainbox">
        <div class="box" id="wheel">
            <div class="item"><b>Phone</b></div>
            <div class="item"><b>Laptop</b></div>
            <div class="item"><b>Watch</b></div>
            <div class="item"><b>Cash</b></div>
            <div class="item"><b>T-Shirt</b></div>
            <div class="item"><b>Book</b></div>
            <div class="item"><b>Bottle</b></div>
            <div class="item"><b>Sorry</b></div>
        </div>
    </div>

    <button class="spin-btn" onclick="spinWheel()">SPIN NOW</button>
    
    <div id="result"></div>

    <script>
        function spinWheel() {
            const wheel = document.getElementById('wheel');
            const resultDisplay = document.getElementById('result');
            
            // Result eka clear karanna
            resultDisplay.innerHTML = "Spinning...";

            // Random rotation ekak (at least 5 rounds + random degree)
            const randomDeg = Math.floor(Math.random() * 360) + 1800; 
            
            wheel.style.transform = `rotate(${randomDeg}deg)`;

            // Wheel eka nawathunama result eka pennanna
            setTimeout(() => {
                // Mokakda dinapu item eka kiyala calculate karanna puluwan math ekakin
                // Eth meka simple version ekak nisa message ekak danna puluwan
                resultDisplay.innerHTML = "Congratulations! 🎉";
            }, 5000); // 5 seconds (animation time eka)
        }
    </script>

</body>
</html>
